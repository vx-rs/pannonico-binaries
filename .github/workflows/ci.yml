name: Pannonico public binary release

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*.*.*"]

concurrency:
  group: binaries-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts --loglevel error
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - name: Validate imported release on a tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run validate-release -- "${RELEASE_TAG#v}"
      - name: Check exact target package tarballs on a tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64 wasi; do
            npm pack --dry-run --json --ignore-scripts "packages/$target"
          done

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create the validated public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            public-release/assets/* \
            public-release/RELEASE_NOTES.md \
            public-release/SHA256SUMS \
            public-release/metadata/* \
            release-manifest.json \
            --notes-file public-release/RELEASE_NOTES.md \
            --title "Pannonico ${RELEASE_TAG#v}" \
            --verify-tag
